name: campus-network-security

topology:
  nodes:
    # 1. Central Router / Firewall Node
    router:
      kind: linux
      image: alpine:latest
      binds:
        - config/iptables.rules:/etc/iptables.rules
      exec:
        - apk add --no-cache iptables
        - sysctl -w net.ipv4.ip_forward=1
        - ip addr replace 10.10.10.1/24 dev eth1
        - ip addr replace 10.10.20.1/24 dev eth2
        - ip addr replace 10.10.30.1/24 dev eth3
        - ip addr replace 10.10.40.1/24 dev eth4
        - sh -c 'iptables-restore < /etc/iptables.rules'

    # 2. Alpine Linux Layer-2 Switches per Subnet
    sw-student:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-faculty:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-admin:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set br0 up

    sw-services:
      kind: linux
      image: alpine:latest
      exec:
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip link add br0 type bridge
        - ip link set eth1 master br0
        - ip link set eth2 master br0
        - ip link set eth3 master br0
        - ip link set eth4 master br0
        - ip link set br0 up

    # 3. Subnet Clients
    student-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 10.10.10.10/24 dev eth1   
        - ip route replace default via 10.10.10.1 dev eth1  

    faculty-client:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 10.10.20.10/24 dev eth1   
        - ip route replace default via 10.10.20.1 dev eth1  

    admin-client:
      kind: linux
      image: alpine:latest
      exec:  
        - apk add --no-cache curl netcat-openbsd
        - ip addr add 10.10.30.10/24 dev eth1   
        - ip route replace default via 10.10.30.1 dev eth1  

    # 4. Centralized Services Subnet
    waf-proxy:
      kind: linux
      image: custom-waf:latest
      env:
        BACKEND: "http://10.10.40.81:3000"
        MODSEC_RULE_ENGINE: "On"
      binds:
        - config/modsec-custom.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-CUSTOM.conf:ro
      exec:  
        - ip addr add 10.10.40.80/24 dev eth1   
        - ip route replace default via 10.10.40.1 dev eth1  

    juiceshop-app:
      kind: linux
      image: custom-juiceshop:latest
      exec:  
        - ip addr add 10.10.40.81/24 dev eth1   
        - ip route replace default via 10.10.40.1 dev eth1  

    postgres-db:
      kind: linux
      image: postgres:15-alpine
      env:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: grading_db
      exec:
        - apk add --no-cache iproute2  
        - ip addr add 10.10.40.100/24 dev eth1   
        - ip route replace default via 10.10.40.1 dev eth1  

  links:
    - endpoints: ["router:eth1","sw-student:eth2"]
    - endpoints: ["router:eth2","sw-faculty:eth2"]
    - endpoints: ["router:eth3","sw-admin:eth2"]
    - endpoints: ["router:eth4","sw-services:eth4"]
    - endpoints: ["sw-student:eth1","student-client:eth1"]
    - endpoints: ["sw-faculty:eth1","faculty-client:eth1"]
    - endpoints: ["sw-admin:eth1","admin-client:eth1"]
    - endpoints: ["sw-services:eth1","waf-proxy:eth1"]
    - endpoints: ["sw-services:eth2","juiceshop-app:eth1"]
    - endpoints: ["sw-services:eth3","postgres-db:eth1"]
